# Application Configuration
spring.application.name=CrudServiceProject
server.port=8083

# PostgreSQL Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://postgresdb:5432/klutaskdb
spring.datasource.username=postgres
spring.datasource.password=docker

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Swagger UI / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Eureka Instance Configuration
eureka.instance.appname=CrudServiceProject
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Application Information
management.info.env.enabled=true
info.app.name=CrudServiceProject
info.app.description=Bike Rental CRUD Service
info.app.version=0.0.1-SNAPSHOT