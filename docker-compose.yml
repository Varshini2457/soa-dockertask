services:
  postgresdb:
    image: postgres:16
    container_name: postgresdb
    environment:
      POSTGRES_DB: klutaskdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d klutaskdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./CrudServiceProject_Modified/CrudServiceProject
      dockerfile: Dockerfile
    container_name: bike-rental-backend
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresdb:5432/klutaskdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: docker
      EUREKA_CLIENT_ENABLED: "false"
    depends_on:
      postgresdb:
        condition: service_healthy

  frontend:
    build:
      context: ./Bike-Rental-Frontend/BikeRental
      dockerfile: Dockerfile
    container_name: bike-rental-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: