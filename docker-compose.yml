
services:
  postgresdb:
    image: postgres:16
    container_name: postgresdb
    environment:
      POSTGRES_DB: exam_2400031985
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sri2457
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d exam_2400031985"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: varshinimulpuri/docker-backend-2400031985:latest
    container_name: bike-rental-backend
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresdb:5432/exam_2400031985
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://host.docker.internal:8761/eureka/
    depends_on:
      postgresdb:
        condition: service_healthy

  frontend:
    image: varshinimulpuri/docker-frontend-2400031985:latest
    container_name: bike-rental-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
